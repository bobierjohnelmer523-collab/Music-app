server.port=${PORT:8080}

spring.application.name=spotify-clone-backend

# Fallback values if DATABASE_URL is not set (for local testing)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spotify_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration (override with JWT_SECRET in environment if desired)
app.jwt.secret=${JWT_SECRET:SpotifyCloneSuperSecretKeyThatIsAtLeast32BytesLongForHmacSha256!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
